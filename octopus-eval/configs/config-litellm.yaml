server:
  addr: "127.0.0.1:8787"
classifier:
  model: ""
  max_tokens: 256
  timeout: "10s"
weights: { quality: 0.5, cost: 0.3, speed: 0.2 }
routing:
  session_sticky: true
  session_ttl: "1h"
  cache_aware: true
  max_attempts: 1
default_model: "litellm/claude-haiku-4-5@20251001-global"
providers:
  litellm:
    kind: anthropic
    base_url: "https://litellm-stg.aip.gov.sg"
    api_key_env: "OPENAI_API_KEY"
catalog:
  - id: "litellm/claude-haiku-4-5@20251001-global"
    quality: 0.75
    cost_per_mtok_in: 1.0
    cost_per_mtok_out: 5.0
    speed: 0.9
    caps: { tools: true, vision: true, reasoning: false, max_context: 200000 }
