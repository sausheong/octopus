name: CI

on:
  push:
  pull_request:

# This job only reads the checkout. Narrowing the token means a compromised
# action in the dependency chain cannot push, tag, or open issues.
permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 15
    # Linux only, by design. cmd/octopus/main_darwin.go and menubar/ are cgo
    # plus Objective-C; a Linux runner compiles the !darwin path, which still
    # covers every test-bearing package. `make app` exercises the macOS path
    # before a release. This is a deliberate trade, not an oversight.
    runs-on: ubuntu-latest
    env:
      # go.work is gitignored so a CI checkout has none, but -mod=readonly
      # turns a stray go.mod edit into a failure instead of a silent repair.
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.25.12'
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # Kept separate from the plain run so a data race is distinguishable from
      # a logic failure at a glance. Octopus is a concurrent proxy with shared
      # session-affinity state, which is the shape the race detector earns its
      # runtime on.
      - name: Test (race)
        run: go test -race ./...
      - name: Gofmt
        run: |
          # set -e explicitly rather than relying on the runner's default
          # shell: gofmt writes parse errors to stderr and exits 2, leaving
          # $unformatted empty, so without -e an unparseable file would pass
          # this gate silently.
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Evaluation report and production-gate tests
        env:
          PYTHONPATH: octopus-eval/scripts
        run: python3 -m unittest discover -s octopus-eval/scripts -p 'test_*.py'
      - name: Release evidence and shell syntax tests
        run: |
          python3 -m unittest scripts/test_validate_release_evidence.py
          sh -n scripts/release.sh scripts/build-macos-installer.sh
      - name: Deterministic routing evaluation (Tier A)
        run: ./octopus-eval/run.sh --tier-a

  security:
    name: Vulnerability, secret, and SBOM checks
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.25.12'
          cache: true
      - name: Install pinned security tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
      - name: Go vulnerability scan
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Secret scan
        run: |
          scan_dir=$(mktemp -d)
          trap 'rm -rf "$scan_dir"' EXIT
          git archive HEAD | tar -x -C "$scan_dir"
          "$(go env GOPATH)/bin/gitleaks" dir --redact --no-banner "$scan_dir"
      - name: Generate and validate CycloneDX SBOM
        run: |
          "$(go env GOPATH)/bin/cyclonedx-gomod" mod -json -output-version 1.6 -output /tmp/octopus.cdx.json .
          python3 -c 'import json; d=json.load(open("/tmp/octopus.cdx.json")); assert d["bomFormat"] == "CycloneDX" and d["specVersion"] == "1.6"'

  macos:
    name: macOS application
    timeout-minutes: 20
    runs-on: macos-latest
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.25.12'
          cache: true
      - name: Test Darwin implementation
        run: go test ./...
      - name: Build menu bar application
        run: make app
      - name: Verify application bundle
        run: |
          test -x dist/Octopus.app/Contents/MacOS/octopus
          plutil -lint dist/Octopus.app/Contents/Info.plist
