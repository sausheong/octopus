# Octopus configuration. Copy to config.yaml and edit.
server:
  addr: "127.0.0.1:8787"
  # Optional shared secret for the routing endpoints. This names an environment
  # variable; the token itself is never stored here. Omitted (the default) means
  # the endpoints accept any request that reaches them, relying solely on the
  # loopback bind — any local process can spend your provider credits. Naming a
  # variable that is not set in the environment leaves authentication disabled
  # rather than rejecting every request; Octopus logs a warning at startup:
  # "auth token variable is empty; routing endpoints are UNAUTHENTICATED".
  # Clients may send the token as x-api-key or as Authorization: Bearer.
  # auth_token_env: "OCTOPUS_AUTH_TOKEN"

# classifier: routes each request through a cheap model to decide which catalog
# model to use. Omit (or leave model empty) for pure-local setups — the router
# will use a conservative default profile instead of making a classifier call.
classifier:
  model: "anthropic/claude-haiku-3-5-20241022"
  max_tokens: 256
  timeout: "10s"

# Balanced-score weights (need not sum to 1; the scorer normalizes).
weights:
  quality: 0.5
  cost: 0.3
  speed: 0.2

# Amortized routing compares the incumbent model's expected warm cost to
# completion with each candidate's cold first turn plus warm later turns.
# "sticky" preserves hard affinity and "per_turn" uses the balanced scorer on
# every turn. Legacy session_sticky YAML is still accepted and translated.
routing:
  strategy: "amortized"
  # allow_remote: all eligible providers may be used (backwards-compatible default)
  # prefer_local: use eligible local providers when possible, otherwise remote
  # local_only: never send request content to a remote provider; fail closed
  data_policy: "allow_remote"
  session_ttl: "1h"
  cache_aware: true
  default_remaining_turns: 4
  min_switch_savings_usd: 0.01
  min_switch_savings_pct: 0.10
  switch_confidence: 0.60
  # Absolute scoring compares the estimated USD request cost with a stable
  # reference. "relative" retains the legacy eligible-set comparison.
  cost_mode: "absolute"
  cost_reference_usd: 0.10
  high_quality_floor: 0.85
  reasoning_bonus: 0.05
  # Clients may group independent subagent sessions using
  # X-Octopus-Workflow-ID. Cache identities remain separate.
  workflow_affinity: true
  # Background routing is deliberately disabled until exact client request
  # hashes have been observed and allowlisted in Advanced YAML.
  background:
    enabled: false
    model: "deepseek/deepseek-v4-flash"
    signatures: []
  # Maximum backends one request may try before giving up. Every failure
  # consumes an attempt except a malformed request and a cancelled request,
  # which stop immediately. Defaults to 3 when omitted.
  max_attempts: 3

# Backend credentials: api_key_env names the env var holding the key.
providers:
  anthropic:
    api_key_env: "ANTHROPIC_API_KEY"
  openai:
    api_key_env: "OPENAI_API_KEY"
  gemini:
    api_key_env: "GEMINI_API_KEY"
  qwen:
    api_key_env: "QWEN_API_KEY"
    base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"

  # Local inference server (mlx-lm, Ollama, LM Studio, etc.).
  # Only base_url is required — no api_key needed for local servers.
  # Add api_key_env if your server requires authentication.
  mlx:
    kind: openai
    location: local
    base_url: "http://localhost:8080/v1"

  # Providers may use any name and declare a `kind` to pick the client type.
  # This lets several Anthropic-compatible backends coexist, each with its own
  # base_url and key. `kind` defaults to the provider name when omitted.
  # Credentials: prefer `api_key_env` (no secret in the file); `api_key` sets
  # the key inline and takes precedence — use it only in a gitignored config.
  #
  # deepseek:
  #   kind: anthropic
  #   api_key_env: "DEEPSEEK_API_KEY"
  #   base_url: "https://api.deepseek.com/anthropic"

catalog:
  - id: "anthropic/claude-opus-4-0-20250514"
    quality: 0.98
    cost_per_mtok_in: 15.0
    cost_per_mtok_out: 75.0
    speed: 0.4
    # max_output_tokens is optional; omit it (or use 0) for no output limit.
    caps: { tools: true, vision: true, reasoning: true, max_context: 1000000, max_output_tokens: 32000 }
    # Optional work-per-turn priors. Omitted or zero values are neutral (1.0).
    turn_efficiency: { trivial: 1.0, low: 1.0, medium: 1.0, high: 1.0 }
  - id: "anthropic/claude-haiku-3-5-20241022"
    quality: 0.70
    cost_per_mtok_in: 1.0
    cost_per_mtok_out: 5.0
    speed: 0.95
    caps: { tools: true, vision: true, reasoning: false, max_context: 200000 }

  # Gemini. Cost/quality scalars are estimates; tune. caps.tools is safe to
  # leave true — Octopus generates a unique synthetic tool-call ID whenever
  # Gemini omits one, so conversation history round-trips cleanly if routing
  # later moves the same conversation to an Anthropic-shaped backend.
  - id: "gemini/gemini-2.5-pro"
    quality: 0.90
    cost_per_mtok_in: 1.25
    cost_per_mtok_out: 10.0
    speed: 0.55
    caps: { tools: true, vision: true, reasoning: true, max_context: 1000000 }
  - id: "gemini/gemini-2.5-flash"
    quality: 0.80
    cost_per_mtok_in: 0.3
    cost_per_mtok_out: 2.5
    speed: 0.85
    caps: { tools: true, vision: true, reasoning: true, max_context: 1000000 }

  # Local model — set id to "mlx/<model-name>" where model-name matches what
  # the local server reports. Cost is zero for local inference; tune quality,
  # speed, caps, and max_context to match the model you are running.
  - id: "mlx/your-model-name"
    quality: 0.60
    cost_per_mtok_in: 0.0
    cost_per_mtok_out: 0.0
    speed: 0.85
    caps: { tools: false, vision: false, reasoning: false, max_context: 32768 }
