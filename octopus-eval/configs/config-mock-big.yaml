server:
  addr: "127.0.0.1:8787"

# No classifier model: avoids an extra upstream call so the capture contains
# exactly one forwarded request per client request.
classifier:
  model: ""
  max_tokens: 256
  timeout: "10s"

weights:
  quality: 0.5
  cost: 0.3
  speed: 0.2

routing:
  session_sticky: true
  session_ttl: "1h"
  cache_aware: true
  max_attempts: 1

default_model: "mock/test-model"

providers:
  mock:
    kind: anthropic
    base_url: "http://127.0.0.1:9099"
    api_key: "test-key-not-real"

catalog:
  - id: "mock/test-model"
    quality: 0.80
    cost_per_mtok_in: 1.0
    cost_per_mtok_out: 5.0
    speed: 0.90
    caps: { tools: true, vision: true, reasoning: false, max_context: 5000000 }
