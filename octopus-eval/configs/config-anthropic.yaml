# Octopus pointed straight at api.anthropic.com (no gateway).
# Use with: EVAL_BASE=https://api.anthropic.com
#           EVAL_MODEL=claude-haiku-4-5-20251001
#           EVAL_API_KEY=$ANTHROPIC_API_KEY
# Running T1 through this config closes the one gap the original evaluation
# left open: whether Octopus's key-reordering is harmless on the DIRECT
# Anthropic path, not just via a gateway.
server: { addr: "127.0.0.1:8787" }
classifier: { model: "", max_tokens: 256, timeout: "10s" }
weights: { quality: 0.5, cost: 0.3, speed: 0.2 }
routing: { session_sticky: true, session_ttl: "1h", cache_aware: true, max_attempts: 1 }
default_model: "anthropic/claude-haiku-4-5-20251001"
providers:
  anthropic:
    kind: anthropic
    api_key_env: "ANTHROPIC_API_KEY"
catalog:
  - id: "anthropic/claude-haiku-4-5-20251001"
    quality: 0.75
    cost_per_mtok_in: 1.0
    cost_per_mtok_out: 5.0
    speed: 0.9
    caps: { tools: true, vision: true, reasoning: false, max_context: 200000 }
